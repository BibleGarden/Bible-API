services:
  bible-api:
    container_name: bible-api
    build: .
    ports:
      - "9084:8000"
    env_file:
      - .env
    # Provider keys are passed by name from the invoking shell, never from
    # .env. The sentinel preserves unset versus explicitly empty: config
    # rejects the former and accepts the latter only for openai_compat as the
    # deliberate "no Authorization header" statement. Gemini and OpenRouter
    # keys must be non-empty. With AI_ENABLED=false
    # the four AI sentinels count as absent, so disabled deployments need not
    # export unused keys. EMBEDDING_API_KEY remains independently required for
    # remote embeddings.
    environment:
      # Local/test incident diagnostic only. It logs prayer-derived request
      # bodies and raw question-provider responses, so production must keep
      # the default false. A blank or non-boolean value fails at startup.
      AI_QUESTION_LOG_PROVIDER_BODIES: "${AI_QUESTION_LOG_PROVIDER_BODIES-false}"
      AI_QUESTION_API_KEY: ${AI_QUESTION_API_KEY-__BIBLE_API_UNSET__}
      AI_SCRIPTURE_REWRITE_API_KEY: ${AI_SCRIPTURE_REWRITE_API_KEY-__BIBLE_API_UNSET__}
      AI_SCRIPTURE_RERANK_API_KEY: ${AI_SCRIPTURE_RERANK_API_KEY-__BIBLE_API_UNSET__}
      AI_TRANSCRIBE_API_KEY: ${AI_TRANSCRIBE_API_KEY-__BIBLE_API_UNSET__}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY-__BIBLE_API_UNSET__}
    volumes:
      # Host path with mp3 files. Set AUDIO_DIR in .env
      - ${AUDIO_DIR:?set AUDIO_DIR}:/audio
      # Model weights, READ-ONLY. One volume, two consumers:
      #   EMBEDDING_MODEL_PATH   e.g. /models/bge-m3      (EMBEDDING_PROVIDER=local, ADR 0010)
      #   AI_TRANSCRIBE_MODEL_PATH  e.g. /models/whisper/small
      #                          (AI_TRANSCRIBE_PROVIDER=local, ADR 0012)
      # Set EMBEDDING_MODELS_DIR in .env to the host directory that holds the
      # model directories; each variable then names one of them inside the
      # container. The variable keeps its name — it predates the second
      # consumer and renaming it would break every existing `.env` for no
      # gain.
      #
      # 2.3 GB of weights are data, not image: baking them in would make
      # every image pull carry them and every image rebuild re-push them,
      # and they never change. Read-only because nothing in this service
      # ever writes there — the image also runs with HF_HUB_OFFLINE=1, so a
      # missing file is a startup error rather than a download.
      #
      # The default keeps a Gemini deployment working with no new variable:
      # the directory is created empty and never read, because
      # EMBEDDING_PROVIDER=gemini loads no model at all.
      #
      # Note for local development: the command below runs uvicorn with reload, which
      # reloads on every edit under ./app — and on EMBEDDING_PROVIDER=local
      # each reload re-reads 2.3 GB of weights (tens of seconds). That is the
      # cost of loading them at start-up instead of lazily, and it is the
      # right trade for production; edit-heavy sessions may prefer the
      # gemini provider, which loads nothing.
      - ${EMBEDDING_MODELS_DIR:-./models}:/models:ro
      - ./app:/code/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    networks:
      - mysql_default
    command: ["uvicorn", "main:app", "--app-dir", "app", "--reload", "--reload-dir", "app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers", "--no-access-log"]

networks:
  mysql_default:
    external: true
