services:
  bible-api:
    container_name: bible-api
    build: .
    ports:
      - "9084:8000"
    env_file:
      - .env
    # AI provider keys for the company server (Qwen chat + Whisper +
    # embeddings): passed through by NAME ONLY from the invoking shell, never
    # from .env. Compose fills each from the shell environment at
    # `docker compose up`; export them first (see .env for the exact
    # commands and where the values come from). If the shell does not have
    # them (e.g. a reboot restarted this `restart: always` container without
    # a fresh `up`), the variable reaches the container empty and the app
    # runs with key=none — a loud 502 on the AI endpoints, not a silent
    # fallback to any file-stored key.
    environment:
      - AI_OPENAI_COMPAT_API_KEY
      - AI_TRANSCRIBE_API_KEY
      - EMBEDDING_API_KEY
    volumes:
      # Host path with mp3 files. Set AUDIO_DIR in .env
      - ${AUDIO_DIR:?set AUDIO_DIR}:/audio
      # Model weights, READ-ONLY. One volume, two consumers:
      #   EMBEDDING_MODEL_PATH   e.g. /models/bge-m3      (EMBEDDING_PROVIDER=local, ADR 0010)
      #   AI_TRANSCRIBE_MODEL_PATH  e.g. /models/whisper/small
      #                          (AI_TRANSCRIBE_PROVIDER=local, ADR 0012)
      # Set EMBEDDING_MODELS_DIR in .env to the host directory that holds the
      # model directories; each variable then names one of them inside the
      # container. The variable keeps its name — it predates the second
      # consumer and renaming it would break every existing `.env` for no
      # gain.
      #
      # 2.3 GB of weights are data, not image: baking them in would make
      # every image pull carry them and every image rebuild re-push them,
      # and they never change. Read-only because nothing in this service
      # ever writes there — the image also runs with HF_HUB_OFFLINE=1, so a
      # missing file is a startup error rather than a download.
      #
      # The default keeps a Gemini deployment working with no new variable:
      # the directory is created empty and never read, because
      # EMBEDDING_PROVIDER=gemini loads no model at all.
      #
      # Note for local development: the command below is `fastapi dev`, which
      # reloads on every edit under ./app — and on EMBEDDING_PROVIDER=local
      # each reload re-reads 2.3 GB of weights (tens of seconds). That is the
      # cost of loading them at start-up instead of lazily, and it is the
      # right trade for production; edit-heavy sessions may prefer the
      # gemini provider, which loads nothing.
      - ${EMBEDDING_MODELS_DIR:-./models}:/models:ro
      - ./app:/code/app
    restart: always
    networks:
      - mysql_default
    command: ["fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]

networks:
  mysql_default:
    external: true
