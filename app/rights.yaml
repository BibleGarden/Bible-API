    changes: &id001
      en: Converted to application data and HTML formats; red-letter markup was transferred onto the stored
        wording. Differences between the stored wording and later source editions are documented; a complete
        word-level comparison has not been performed.
      ru: Преобразовано в форматы данных и HTML приложения; разметка слов Иисуса перенесена на сохранённый
        текст. Документированы различия сохранённого текста и более поздних изданий источника; полная
        пословная сверка не выполнена.
      uk: Перетворено на формати даних та HTML застосунку; розмітку слів Ісуса перенесено на збережений
        текст. Задокументовано відмінності збереженого тексту й пізніших видань джерела; повного послівного
        звірення не виконано.
    trademark: &id002
      en: World English Bible is a trademark identifying faithful copies. If the words are changed, the
        resulting text must not be called World English Bible. The name here identifies the source translation;
        it is not a certification that every stored word matches the current publisher edition.
      ru: World English Bible — товарный знак для точных копий перевода. При изменении слов получившийся
        текст нельзя называть World English Bible. Здесь название обозначает исходный перевод и не удостоверяет
        пословное совпадение сохранённого текста с текущим изданием издателя.
      uk: World English Bible — торговельна марка для точних копій перекладу. Якщо слова змінено, отриманий
