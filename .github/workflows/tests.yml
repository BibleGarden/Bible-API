name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag bible-api-ci:${{ github.sha }} .

      - name: Run offline test suite
        run: |
          docker run --rm \
            --env API_KEY=test-api-key \
            --env AI_CLIENT_HMAC_KEY=test-hmac-key \
            bible-api-ci:${{ github.sha }} \
            pytest -q
