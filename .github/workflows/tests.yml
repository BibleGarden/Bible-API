name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag bible-api-ci:${{ github.sha }} .

      - name: Run offline test suite
        run: |
          docker run --rm \
            --env BIBLE_GARDEN_API_KEY=test-api-key \
            --env LAMPADA_API_KEY=lampada-test-key-12345678901234567890 \
            --env OPS_API_KEY=ops-test-key-1234567890123456789012 \
            bible-api-ci:${{ github.sha }} \
            pytest -q
